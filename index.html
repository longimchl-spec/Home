.sub{color:var(--mu);margin:0 0 18px}

.t1,.t2{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:20px;margin:0 6px 8px 0}
.t1{background:var(--b);color:#fff}.t2{background:var(--a2);color:#3A2218}
.back{background:none;color:var(--b);font-weight:700;padding:10px 0}
.det{display:grid;gap:22px;grid-template-columns:1fr;margin-top:6px}

.contact{background:var(--cd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.contact a{display:block;color:var(--b);font-weight:700;text-decoration:none;padding:8px 0;font-size:1.05rem}
.ticket{background:var(--cd);border-radius:20px;box-shadow:var(--sh);overflow:hidden;max-width:560px;margin:14px 0}

.ok{display:flex;gap:10px;flex-wrap:wrap}.btn.alt{background:var(--b);box-shadow:none}
.hm{display:grid;place-items:center;padding:8px 14px}.hm img{width:22px;height:22px;display:block}
@media(max-width:420px){header{padding:10px 12px;gap:6px}.logo{font-size:1rem}.ic{width:36px;height:36px}.dots{gap:4px}}
</style></head>
